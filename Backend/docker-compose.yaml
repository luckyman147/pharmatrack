services:

  mongo:
    image: mongo

    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongopa
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/var/lib/mongodb/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - pharmanet

volumes:

  mongodata:
networks:
  pharmanet:
    driver: bridge
