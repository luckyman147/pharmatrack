<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-dark fw-bold">Historique d'Activité</h2>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
            <tr>
              <th class="ps-4">Date</th>
              <th>Utilisateur</th>
              <th>Role</th>
              <th>Action</th>
              <th>Type d'Entité</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let log of logs">
              <td class="ps-4 text-dark">{{ log.timestamp | date:'medium' }}</td>
              <td class="text-dark fw-semibold">{{ log.userName }}</td>
              <td><span class="badge bg-secondary">{{ log.userRole }}</span></td>
              <td><span class="badge bg-primary">{{ log.action }}</span></td>
              <td class="text-dark">{{ log.entityType }}</td>
              <td class="text-muted">{{ log.description }}</td>
            </tr>
            <tr *ngIf="logs.length === 0 && !loading">
              <td colspan="6" class="text-center py-4 text-muted">Aucune activité trouvée.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- Pagination -->
    <div class="card-footer bg-white border-top-0 py-3" *ngIf="totalPages > 1">
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" [class.disabled]="pageIndex === 1">
                    <button class="page-link" (click)="onPageChange(pageIndex - 1)">Précédent</button>
                </li>
                <li class="page-item disabled">
                    <span class="page-link">Page {{ pageIndex }} sur {{ totalPages }}</span>
                </li>
                <li class="page-item" [class.disabled]="pageIndex === totalPages">
                    <button class="page-link" (click)="onPageChange(pageIndex + 1)">Suivant</button>
                </li>
            </ul>
        </nav>
    </div>
  </div>

  <div *ngIf="loading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>
</div>
