<!--breadcrumb-->
<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
  <div class="breadcrumb-title pe-3">Produits</div>
  <div class="ps-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0 p-0">
        <li class="breadcrumb-item">
          <a href="javascript:;"><i class="bx bx-home-alt"></i></a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Catégories</li>
      </ol>
    </nav>
</div>
</div>
    <app-add-update-categorie [categoryId]="categoryId" (LoadChanges)="loadCategories()" [isUpdateMode]="isUpdateMode" [categoryName]="categoryName"></app-add-update-categorie>

<!--end breadcrumb-->
<div class="py-3 p-2 w-100">
    <div class="input-group w-100">
        <input 
            type="text"
            class="form-control"
            placeholder="Rechercher une catégorie..."
            [(ngModel)]="searchName"
            (keyup.enter)="onSearch()"
        />
        <button class="btn btn-light" type="button" (click)="onSearch()">Rechercher</button>
    </div>
</div>


<div class="card border ">
    <!-- Header: Search & Add -->

  <!-- Body: Table -->
  <div class="card-body">
    <div class="table-responsive" *ngIf="!isLoading; else loading">
      <table class="table align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let category of categories">
                <td class="text-primary">#{{ category.id | slice:0:4 }}</td>
            <td>{{ category.name }}</td>
            <td>
              <div class="d-flex align-items-center gap-3 fs-6">
                <a href="javascript:;" class="text-warning" title="Modifier" (click)="updateCategory(category)">
                  <i class="bi bi-pencil-fill"></i
                ></a>
                <a href="javascript:;" class="text-danger" title="Supprimer" (click)="deleteCategory(category.id)"
                  ><i class="bi bi-trash-fill"></i
                ></a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="categories.length === 0" class="text-center text-muted">
        Aucune catégorie trouvée.
      </div>
    </div>

    <ng-template #loading>
      <div class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Chargement...</span>
        </div>
      </div>
    </ng-template>
  </div>
</div>
