<!--breadcrumb-->
<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
<div class="breadcrumb-title pe-3 d-flex align-items-center gap-2">
    <button type="button" class="btn btn-sm  d-flex align-items-center" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
    </button>
    <span>Produit</span>
</div>
  <div class="ps-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0 p-0">
        <li class="breadcrumb-item"><a routerLink="/"><i class="bx bx-home-alt"></i></a></li>
        <li class="breadcrumb-item active" aria-current="page">Détails du produit</li>
      </ol>
    </nav>
  </div>
</div>
<!--end breadcrumb-->

<div class="card" *ngIf="produit">
<div class="py-3 border-bottom">
  <div class="d-flex align-items-center justify-content-between flex-wrap">
    
    <!-- 🟢 Product info (Left side) -->
<div class="card shadow-sm border-0 mx-4 my-3 p-4">
  <div class="d-flex justify-content-between align-items-start">
    <div>
      <h5 class="fw-bold text-primary mb-2">{{ produit.name }}</h5>
      <p class="mb-1"><strong>Catégorie :</strong> {{ produit.categorie.name }}</p>
      <p class="mb-1"><strong>Prix de vente :</strong> {{ produit.prixVente }} DT</p>
      <p class="text-muted small mb-0">{{ produit.description }}</p>
    </div>
 
  </div>
</div>

    <!-- 🔵 Buttons (Right side) -->
    <div class="d-flex gap-2 p-3 ms-auto">
      <button type="button" class="btn btn-primary d-flex align-items-center gap-1" (click)="editProduct(produit)">
        <i class="bi bi-pencil-square"></i>
        <span>Mettre à jour</span>
      </button>
      <button type="button" class="btn btn-danger d-flex align-items-center gap-1" (click)="deleteProduct(produit.id)">
        <i class="bi bi-trash"></i>
        <span>Supprimer</span>
      </button>
    </div>
  </div>
</div>



  <div class="card-body">
    <!-- Depots -->
    <div class="row">
     
        <div class="card border shadow-none radius-10">
          <div class="card-body">
            <h5 class="mb-3">Dépôts disponibles</h5>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Dépot ID</th>
                    <th>Nom de dépot</th>
                    <th>Quantité</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let depot of produit.depots">
                    <td>{{ depot.depotId }}</td>
                    <td>{{ depot.depotName }}</td>
                    <td>{{ depot.quantity }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          
        </div>
      </div>

      <!-- Product summary -->
    </div>
  </div>
</div>
