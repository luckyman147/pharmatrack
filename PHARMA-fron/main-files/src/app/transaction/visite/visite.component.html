<!--breadcrumb-->
<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
	<div class="breadcrumb-title pe-3">Transaction</div>
	<div class="ps-3">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb mb-0 p-0">
				<li class="breadcrumb-item"><a href="javascript:;"><i class="bx bx-map-pin"></i></a>
				</li>
				<li class="breadcrumb-item active" aria-current="page">Les Visites</li>
			</ol>
		</nav>
	</div>
	
</div><div class="container mt-3">
  <div class="row mb-3">
    <div 
      class="col-12 d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center"
    >
      <!-- Button -->
      <button 
        type="button" 
        class="btn text-white mb-2 mb-md-0" 
        style="background-color: #00A389; border-radius: 18px;"
      >
        <i class='bx bx-plus' style="margin-right: 4px;"></i> 
        Créer un Visite
      </button>

      <!-- Pagination -->
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="pageIndex === 0">
          <button class="page-link" (click)="prevPage()">Precedent</button>
        </li>

        <li 
          class="page-item" 
          *ngFor="let page of pageNumbers" 
          [class.active]="pageIndex === page"
        >
          <button class="page-link" (click)="goToPage(page)">{{ page + 1 }}</button>
        </li>

        <li class="page-item" [class.disabled]="pageIndex >= totalPages - 1">
          <button class="page-link" (click)="nextPage()">Suivant</button>
        </li>
      </ul>
    </div>
  </div>
</div>


<div class="container mt-4">

	<!--end breadcrumb-->
	<div class="row">
		<div class="col-12 col-lg-8">

			<app-components [visites]="visites$ | async"></app-components>
		</div>
		<div class="col-12 col-lg-4 ">
			<div class="card w-100">
				<div class="card-header py-3">
					<h5 class="mb-0">Filtrer par</h5>
				</div>
				<div class="card-body">
					
					<div class="position-relative">
						<div class="position-absolute top-50 translate-middle-y search-icon px-3">
							<i class="bi bi-search"></i>
            </div>
            <input class="form-control ps-5" type="text" placeholder="Rechercher Visite ici...">
        </div>
					
		
		<form class="row g-3"[formGroup]="filterForm"  (ngSubmit)="applyFilters()">
		<div class="col-12">
						<label class="form-label">Date de début</label>
						<input type="date" formControlName="startDate"class="form-control">
					</div>
					<div class="col-12">
						<label class="form-label">Date de fin</label>
						<input type="date"formControlName="endDate" class="form-control">
					</div>
					<div class="col-12">
						<div class="d-grid">
							<button class="btn btn-light">Filtrer Visit</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
		
		
		
	
</div>
<!--end row-->
</div>
